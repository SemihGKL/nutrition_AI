name: Deploy to VPS

on:
  push:
    branches: [main]

# Un seul déploiement à la fois : deux runs concurrents se disputeraient le numéro de version.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  test:
    name: Tests backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        working-directory: backend
        run: ./mvnw test

  frontend-test:
    name: Tests frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit -p .

      - name: Run tests
        working-directory: frontend
        run: npm test -- --run

  deploy-script-test:
    name: Tests script de déploiement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tests du script de mise en ligne (faux VPS)
        run: bash deploy/tests/release.test.sh

  deploy:
    name: Build & Deploy
    needs: [test, frontend-test, deploy-script-test]   # aucun déploiement si un test échoue
    runs-on: ubuntu-latest
    permissions:
      contents: write   # commit du nouveau numéro de version sur main

    steps:
      - uses: actions/checkout@v4

      # ── Backend ────────────────────────────────────────────────
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build backend JAR
        working-directory: backend
        run: |
          ./mvnw package -DskipTests
          mv target/backend-*.jar target/app.jar.new

      # ── Frontend ───────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Règle de version : chaque push sur main = +0.1 (0.1.0 → 0.2.0 → 0.3.0…).
      # Le numéro n'est commité qu'après un déploiement réussi (étape « Commit version »).
      - name: Bump version
        id: version
        working-directory: frontend
        run: |
          npm version minor --no-git-tag-version
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # ── Déploiement VPS ────────────────────────────────────────
      # La release est déposée À CÔTÉ de la version en place (rien n'est écrasé pendant
      # que le backend tourne), puis deploy/release.sh bascule, vérifie la santé et
      # revient automatiquement à la version précédente si le backend ne démarre pas.
      - name: Upload backend
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: backend/target/app.jar.new
          target: /opt/nutritionIA/
          strip_components: 2

      - name: Upload frontend
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: frontend/dist/*
          target: /opt/nutritionIA/frontend-new
          strip_components: 2
          rm: true   # repart d'un dossier vide (pas de reste d'une release précédente)

      - name: Upload release script
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: deploy/release.sh
          target: /opt/nutritionIA/
          strip_components: 1

      - name: Release (bascule, santé, retour arrière si échec)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: bash /opt/nutritionIA/release.sh

      # ── Version ────────────────────────────────────────────────
      # Pousser avec GITHUB_TOKEN ne redéclenche aucun workflow (pas de boucle).
      - name: Commit version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json
          git commit -m "chore(release): v${{ steps.version.outputs.version }} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
