name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Backend — Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        working-directory: backend
        run: ./mvnw test

      - name: Build JAR
        working-directory: backend
        run: ./mvnw package -DskipTests

  frontend-test:
    name: Frontend — Types & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'   # LTS, même version qu'en local
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit -p .

      - name: Run tests
        working-directory: frontend
        run: npm test -- --run

  deploy-script-test:
    name: Script de déploiement
    runs-on: ubuntu-latest
    services:
      postgres:   # base jetable pour le script de reprise des données (même version que la prod)
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: [ '5432:5432' ]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Tests du script de mise en ligne (faux VPS)
        run: bash deploy/tests/release.test.sh

      - name: Tests du script de version (faux dépôt distant)
        run: bash deploy/tests/release-version.test.sh

      - name: Tests du script de reprise des totaux (vrai Postgres)
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: bash deploy/tests/restore-legacy-totals.test.sh
