spring.application.name=backend

# Datasource — VPS OVHcloud : définir DATABASE_URL au format jdbc:postgresql://host:port/db
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway — pas de données de seed en production
spring.flyway.locations=classpath:db/migration

# Écoute sur la boucle locale uniquement : seul nginx (même machine) joint le backend.
# Le limiteur de débit se fie à X-Real-IP posé par nginx ; un accès direct au port 8080
# permettrait sinon de le falsifier.
server.address=127.0.0.1

# Reverse-proxy (nginx) qui termine le TLS : lire X-Forwarded-* pour que
# Spring sache que la requête d'origine est en HTTPS.
server.forward-headers-strategy=framework

# Cookie refresh_token envoyé uniquement sur connexion sécurisée (HTTPS).
app.cookie.secure=true

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=900000

# Mail — OVH MX Plan (SSL port 465)
spring.mail.host=ssl0.ovh.net
spring.mail.port=465
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=false

# App base URL
app.base-url=${APP_BASE_URL}

# Adresse destinataire des messages envoyés via « Contactez le support »
app.support-email=${SUPPORT_EMAIL:support@kaloriim.fr}

# Web Push (rappel de pesée) — clés VAPID générées une seule fois sur le VPS.
# Obligatoires : sans elles le contexte Spring ne démarre pas. Ne pas les régénérer
# (les abonnements existants deviendraient invalides).
app.vapid.public-key=${VAPID_PUBLIC_KEY}
app.vapid.private-key=${VAPID_PRIVATE_KEY}
app.vapid.subject=${VAPID_SUBJECT:mailto:support@kaloriim.fr}

# Logging
logging.level.root=INFO
logging.level.com.nutrition.backend=INFO
